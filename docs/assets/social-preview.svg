<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="AlertDam — self-hosted, ChatOps-first incident management">
  <title>AlertDam</title>
  <!--
    GitHub social preview. Rendered to PNG at exactly 1280x640 and uploaded via
    Settings > Social preview (there is no REST endpoint for this).

    Safe area: GitHub crops this to roughly 2:1 in some surfaces and overlays a
    gradient at the bottom in others, so nothing important sits below y=520 or
    within 64px of any edge.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F1113"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="980" cy="300" r="340" fill="url(#glow)"/>

  <!-- Mark -->
  <g transform="translate(872 172) scale(2.05)">
    <g fill="url(#wall)">
      <rect x="20" y="30" width="88" height="20" rx="4"/>
      <rect x="26" y="56" width="76" height="20" rx="4"/>
      <rect x="32" y="82" width="64" height="20" rx="4"/>
    </g>
    <path d="M70 24 L58 68 h13 l-9 40 26-50 H74z"
          fill="#FCA5A5" stroke="#7F1D1D" stroke-width="2.5"
          stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="96" y="252" font-size="104" letter-spacing="-3">
      <tspan fill="#F9FAFB" font-weight="400">Alert</tspan><tspan fill="#EF4444" font-weight="700">Dam</tspan>
    </text>

    <text x="98" y="316" font-size="34" font-weight="500" fill="#D1D5DB">
      Incident management &amp; on-call alerting
    </text>

    <text x="98" y="372" font-size="26" font-weight="400" fill="#9CA3AF">
      Self-hosted. ChatOps-first. One Go binary and PostgreSQL.
    </text>

    <!-- Attribute chips -->
    <g font-size="21" font-weight="500">
      <rect x="96"  y="424" width="176" height="46" rx="23" fill="#DC2626" fill-opacity="0.14" stroke="#DC2626" stroke-opacity="0.45"/>
      <text x="184" y="453" fill="#FCA5A5" text-anchor="middle">Apache-2.0</text>

      <rect x="288" y="424" width="150" height="46" rx="23" fill="#DC2626" fill-opacity="0.14" stroke="#DC2626" stroke-opacity="0.45"/>
      <text x="363" y="453" fill="#FCA5A5" text-anchor="middle">Go + React</text>

      <rect x="454" y="424" width="146" height="46" rx="23" fill="#DC2626" fill-opacity="0.14" stroke="#DC2626" stroke-opacity="0.45"/>
      <text x="527" y="453" fill="#FCA5A5" text-anchor="middle">Flutter</text>

      <rect x="616" y="424" width="196" height="46" rx="23" fill="#DC2626" fill-opacity="0.14" stroke="#DC2626" stroke-opacity="0.45"/>
      <text x="714" y="453" fill="#FCA5A5" text-anchor="middle">No Redis, no MQ</text>
    </g>

    <text x="98" y="524" font-size="22" font-weight="400" fill="#6B7280">
      github.com/darisadam/alertdam
    </text>
  </g>
</svg>
