<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="AlertDam">
  <title>AlertDam</title>
  <defs>
    <linearGradient id="wm-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Mark, scaled down from logo.svg -->
  <g transform="translate(4 8) scale(0.625)">
    <g fill="url(#wm-wall)">
      <rect x="20" y="30" width="88" height="20" rx="4"/>
      <rect x="26" y="56" width="76" height="20" rx="4"/>
      <rect x="32" y="82" width="64" height="20" rx="4"/>
    </g>
    <path d="M70 24 L58 68 h13 l-9 40 26-50 H74z"
          fill="#FCA5A5" stroke="#7F1D1D" stroke-width="2.5"
          stroke-linejoin="round"/>
  </g>

  <!-- "Alert" regular, "Dam" bold: the personal half of the name carries the weight -->
  <text x="98" y="62"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="46" letter-spacing="-1">
    <tspan fill="currentColor" font-weight="400">Alert</tspan><tspan fill="#DC2626" font-weight="700">Dam</tspan>
  </text>
</svg>
