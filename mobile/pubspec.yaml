name: alertdam_mobile
description: "AlertDam mobile app — on-call alerting with iOS Critical Alerts and Android DND bypass."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.7.0

  # Firebase (FCM push notifications)
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # Local notifications (DND bypass, critical alerts)
  flutter_local_notifications: ^22.2.0

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Secure storage (for API tokens)
  flutter_secure_storage: ^10.3.1

  # Date/time
  intl: ^0.20.3

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
