name: alertdam_mobile
description: "AlertDam mobile app — on-call alerting with iOS Critical Alerts and Android DND bypass."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.7.0

  # Firebase (FCM push notifications)
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

  # Local notifications (DND bypass, critical alerts)
  flutter_local_notifications: ^22.3.3

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.1.2

  # Secure storage (for API tokens)
  flutter_secure_storage: ^11.2.0

  # Date/time
  intl: ^0.20.3

  # UI
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
