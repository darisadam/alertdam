name: alertdam_mobile
description: "AlertDam mobile app — on-call alerting with iOS Critical Alerts and Android DND bypass."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.7.0

  # Firebase (FCM push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notifications (DND bypass, critical alerts)
  flutter_local_notifications: ^17.2.3

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Secure storage (for API tokens)
  flutter_secure_storage: ^10.3.1

  # Date/time
  intl: ^0.20.3

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
