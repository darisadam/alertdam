# `flutter_lints` was already declared in pubspec.yaml dev_dependencies, but
# without this file the ruleset was never activated — `flutter analyze` ran with
# bare defaults.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing/incorrect docs and unused code as errors in CI.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # riverpod_generator emits @Riverpod on elements the analyzer considers
    # invalid annotation targets; this is expected and upstream-known.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Style
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unnecessary_late: true
    unnecessary_parenthesis: true

    # Correctness — these matter for an alerting app that must not silently drop work
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    discarded_futures: true
    unawaited_futures: true
    only_throw_errors: true
    throw_in_finally: true

    # Public API hygiene
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
