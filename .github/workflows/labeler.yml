name: Labeler

on:
  # pull_request_target because pull-requests: write is required to apply labels
  # and a fork PR's token is read-only. There is NO checkout in this job, and
  # actions/labeler enumerates changed files through the API — so no
  # fork-controlled code is ever fetched or executed.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  label:
    name: Apply labels
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
