# Label taxonomy — the single source of truth.
#
# Synced to GitHub by .github/workflows/labels.yml on every push to main
# that touches this file. Preview changes without applying them:
#   gh workflow run labels.yml -f dry_run=true
#
# Colour is grouped by prefix so the issue list is scannable at a glance:
#   area/*     blue     type/*   green    priority/*  red-to-pale ramp
#   status/*   violet   size/*   grey     specials    per-meaning
#
# NOTE: 'good first issue', 'help wanted' and 'dependencies' are
# load-bearing names — GitHub surfaces the first two in its contributor
# funnel and Dependabot applies the third. Do not rename them.

labels:
  - name: "area/backend"
    color: "1D76DB"
    description: "Go backend engine"
  - name: "area/web"
    color: "1D76DB"
    description: "React web dashboard"
  - name: "area/mobile"
    color: "1D76DB"
    description: "Flutter mobile app"
  - name: "area/db"
    color: "1D76DB"
    description: "Database schema and migrations"
  - name: "area/deploy"
    color: "1D76DB"
    description: "Docker, Compose, Kubernetes, packaging"
  - name: "area/ci"
    color: "1D76DB"
    description: "CI/CD, workflows, repo tooling"
  - name: "area/docs"
    color: "1D76DB"
    description: "Documentation"
  - name: "area/integrations"
    color: "1D76DB"
    description: "Slack, Discord, Telegram, Teams, Twilio, WhatsApp"
  - name: "type/feat"
    color: "0E8A16"
    description: "New feature"
  - name: "type/fix"
    color: "0E8A16"
    description: "Bug fix"
  - name: "type/docs"
    color: "0E8A16"
    description: "Documentation only"
  - name: "type/refactor"
    color: "0E8A16"
    description: "Code change with no feature or fix"
  - name: "type/perf"
    color: "0E8A16"
    description: "Performance improvement"
  - name: "type/test"
    color: "0E8A16"
    description: "Tests only"
  - name: "type/style"
    color: "0E8A16"
    description: "Formatting only, no logic change"
  - name: "type/chore"
    color: "0E8A16"
    description: "Build, dependencies, maintenance"
  - name: "priority/p0-critical"
    color: "B60205"
    description: "Drop everything"
  - name: "priority/p1-high"
    color: "D93F0B"
    description: "Next up"
  - name: "priority/p2-medium"
    color: "FBCA04"
    description: "Normal queue"
  - name: "priority/p3-low"
    color: "FEF2C0"
    description: "Nice to have"
  - name: "status/needs-triage"
    color: "D4C5F9"
    description: "Awaiting maintainer triage"
  - name: "status/needs-repro"
    color: "D4C5F9"
    description: "Cannot reproduce yet, more information needed"
  - name: "status/needs-review"
    color: "D4C5F9"
    description: "Waiting on maintainer review"
  - name: "status/blocked"
    color: "D4C5F9"
    description: "Blocked on something else"
  - name: "status/duplicate"
    color: "CFD3D7"
    description: "Already tracked elsewhere"
  - name: "status/invalid"
    color: "CFD3D7"
    description: "Not a valid report"
  - name: "status/wontfix"
    color: "CFD3D7"
    description: "Deliberately not being worked on"
  - name: "size/xs"
    color: "EDEDED"
    description: "Under 10 lines changed"
  - name: "size/s"
    color: "EDEDED"
    description: "Under 50 lines changed"
  - name: "size/m"
    color: "EDEDED"
    description: "Under 250 lines changed"
  - name: "size/l"
    color: "EDEDED"
    description: "Under 1000 lines changed"
  - name: "size/xl"
    color: "EDEDED"
    description: "Over 1000 lines changed"
  - name: "breaking-change"
    color: "B60205"
    description: "Requires action from users on upgrade"
  - name: "security"
    color: "B60205"
    description: "Security impact"
  - name: "dependencies"
    color: "0366D6"
    description: "Dependency updates"
  - name: "good first issue"
    color: "7057FF"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "question"
    color: "D876E3"
    description: "Further information is requested"
  - name: "upstream"
    color: "5319E7"
    description: "Blocked on a third-party project"
  - name: "stale"
    color: "795548"
    description: "No activity, will be closed"
  - name: "pinned"
    color: "FFFFFF"
    description: "Exempt from the stale bot"
  - name: "skip-changelog"
    color: "EEEEEE"
    description: "Excluded from release notes"
